name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must exist)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          for t in amd64 arm64 armv7; do
            arch=$t; goarm=""
            if [ "$t" = armv7 ]; then arch=arm; goarm=7; fi
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$goarm go build -trimpath \
              -ldflags "-s -w -X github.com/neoauroraproject/Neo-Uptime/internal/version.Version=${TAG}" \
              -o dist/neo-uptime ./cmd/neo-uptime
            tar -czf dist/neo-uptime-linux-$t.tar.gz -C dist neo-uptime -C .. README.md LICENSE install.sh
            rm dist/neo-uptime
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$goarm go build -trimpath \
              -ldflags "-s -w -X github.com/neoauroraproject/Neo-Uptime/internal/version.Version=${TAG}" \
              -o dist/neo-uptime-agent ./cmd/neo-uptime-agent
            tar -czf dist/neo-uptime-agent-linux-$t.tar.gz -C dist neo-uptime-agent -C .. LICENSE agent.sh
            rm dist/neo-uptime-agent
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Neo Uptime ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  docker:
    runs-on: ubuntu-latest
    needs: binaries
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
